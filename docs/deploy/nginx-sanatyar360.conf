# ─────────────────────────────────────────────────────────────────────────────
# Nginx معکوس — جلوی صنعت‌یار۳۶۰ (فاز اعتماد v1.1.0)
#
# اصل: پورت برنامه (8092) مستقیم روی اینترنت باز نیست؛ Nginx با HTTPS جلوی آن.
# استقرار:
#   1) cp nginx-sanatyar360.conf /etc/nginx/conf.d/sanatyar360.conf
#   2) مسیر گواهی را ست کنید (letscrypt یا گواهی سازمانی)
#   3) certbot --nginx -d sanatyar.example.ir   (برای گواهی خودکار)
#   4) nginx -t && systemctl reload nginx
#   5) فایروال: فقط 80/443 باز؛ 8092 بسته برای بیرون (ufw deny 8092/tcp)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name sanatyar.example.ir;
    # ریدایرکت کامل به HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sanatyar.example.ir;

    ssl_certificate     /etc/letsencrypt/live/sanatyar.example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanatyar.example.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # اندازهٔ آپلود — هماهنگ با سقف 20MB سامانه
    client_max_body_size 24m;

    # هدرهای امنیتی پایه
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API و SPA — هم‌مبدأ؛ کوکی SSO با Secure از همین دامنه ست می‌شود
    location / {
        proxy_pass         http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # فایل‌های ایستای بیلد فرانت‌اند با کش
    location /assets/ {
        proxy_pass http://127.0.0.1:8092;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# یادآوری تنظیم برنامه پشت پروکسی:
#   SSO_PUBLIC_BASE_URL=https://sanatyar.example.ir
# تا redirect_uri و کوکی SSO با دامنهٔ HTTPS ساخته شوند.
