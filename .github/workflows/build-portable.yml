name: Build Portable (Windows/Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx vite build

      - name: Install backend + PyInstaller
        working-directory: backend
        run: pip install -r ../portable/requirements-portable.txt

      - name: Build portable executable
        run: pyinstaller portable/sanatyar360.spec --distpath dist_portable --workpath build_pyinstaller

      - name: Smoke test portable executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist_portable\Sanatyar360\Sanatyar360.exe" -ArgumentList "--no-browser","--port","8099" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..45) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8099/api/v1/health" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          try {
            $h = Invoke-WebRequest -Uri "http://127.0.0.1:8099/" -UseBasicParsing -TimeoutSec 5
            if ($h.StatusCode -ne 200) { $ok = $false }
          } catch { $ok = $false }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path sanatyar360.log) { Get-Content sanatyar360.log }
          if (-not $ok) { Write-Host "::error::Windows portable exe failed health check"; exit 1 }
          Write-Host "WINDOWS SMOKE TEST OK"

      - name: Smoke test portable executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./dist_portable/Sanatyar360/Sanatyar360 --no-browser --port 8099 &
          EXE_PID=$!
          ok=0
          for i in $(seq 1 45); do
            sleep 2
            if curl -sf http://127.0.0.1:8099/api/v1/health > /dev/null; then ok=1; break; fi
          done
          curl -sf -o /dev/null http://127.0.0.1:8099/ || ok=0
          kill $EXE_PID 2>/dev/null || true
          cat sanatyar360.log 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo "::error::Linux portable exe failed health check"; exit 1; fi
          echo "LINUX SMOKE TEST OK"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item portable/README-portable-fa.md dist_portable/Sanatyar360/
          Compress-Archive -Path dist_portable/Sanatyar360 -DestinationPath Sanatyar360-portable-windows.zip

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp portable/README-portable-fa.md dist_portable/Sanatyar360/
          chmod +x dist_portable/Sanatyar360/Sanatyar360
          tar czf Sanatyar360-portable-linux.tar.gz -C dist_portable Sanatyar360

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sanatyar360-portable-${{ matrix.os }}
          path: |
            Sanatyar360-portable-windows.zip
            Sanatyar360-portable-linux.tar.gz
          if-no-files-found: ignore

  release:
    # انتشار ریلیز واحد — پس از اتمام هر دو بیلد، فقط برای تگ‌ها
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          body: |
            # صنعت‌یار۳۶۰ — ریلیز ${{ github.ref_name }}

            **اتصال دانشجو به صنعت | زیرسیستم دانشجو۳۶۰**

            ## بسته‌های پرتیبل (بدون نیاز به نصب پایتون یا PostgreSQL)

            | فایل | پلتفرم |
            |---|---|
            | `Sanatyar360-portable-windows.zip` | ویندوز 10/11 (x64) |
            | `Sanatyar360-portable-linux.tar.gz` | لینوکس (x64) |

            ## نصب و اجرا

            1. بسته را دانلود و **استخراج** کنید (داخل پوشه `Sanatyar360`).
            2. فایل `Sanatyar360.exe` را **دوبار کلیک** کنید.
            3. پس از چند ثانیه (بار اول کمی بیشتر، تا داده نمونه ساخته شود)
               مرورگر به‌صورت خودکار روی `http://localhost:8092` باز می‌شود.

            ⚠️ اگر ویندوز پیام آبی SmartScreen نشان داد: «More info» ← «Run anyway».
            ⚠️ فایل `Sanatyar360.exe` و پوشه `_internal` باید کنار هم بمانند.

            پایگاه داده SQLite به‌صورت خودکار کنار برنامه ساخته و با داده نمونه پر می‌شود.
            در صورت بروز هر مشکل، فایل `sanatyar360.log` کنار برنامه ثبت رویدادها است.
            راهنمای کامل: `README-portable-fa.md` داخل هر بسته.

            ## ورود

            - **ورود یکپارچه (SSO)** — دکمه نارنجی «ورود یکپارچه با حساب دانشجو۳۶۰»؛
              جریان کامل OIDC با Client ID `sanatyar360` و کلید سامانه `sanatyar`.
              در نبود سامانه مادر، شبیه‌ساز داخلی با همان جریان اجرا می‌شود.
            - **ورود محلی** — حساب‌های نمونه با رمز `uiis1234`
              (مثلاً `cio@nav.ac.ir` مدیر دفتر ارتباط با صنعت).

            ## گزینه‌های خط فرمان

            ```
            Sanatyar360.exe --port 8092        # پورت (پیش‌فرض 8092)
            Sanatyar360.exe --host 0.0.0.0     # دسترسی از شبکه
            Sanatyar360.exe --no-browser       # باز نکردن مرورگر
            Sanatyar360.exe --reset-db         # بازنشانی داده نمونه
            ```

            ## امکانات این نسخه

            - چرخه کامل تعامل: ثبت مسئله ← بررسی و انتشار ← تطبیق ← همکاری ← دستاورد
            - موتور تطبیق قواعدی نسخه‌دار (`rules-v1.0`) با ثبت دلیل پیشنهادها
            - ورود یکپارچه OIDC با سامانه مادر دانشجو۳۶۰ + نگاشت نقش‌های `sanatyar.*`
            - حسابرسی کامل عملیات حساس، سطوح محرمانگی، ایزولاسیون سازمانی
            - رابط فارسی RTL با تم تیره گلس‌مورفیسم، داشبورد و تحلیل‌های بصری
            - 84 سناریوی پذیرش e2e — موفق روی PostgreSQL و SQLite
          files: |
            artifacts/Sanatyar360-portable-windows.zip
            artifacts/Sanatyar360-portable-linux.tar.gz
